name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      release_tag:
        description: Existing version tag created by Release Please
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish
    runs-on: macos-26
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate release version
        run: |
          expected_tag="v$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "$expected_tag"
          scripts/check-version.sh
      - name: Run tests
        run: scripts/ci.sh
      - name: Import self-signed release identity
        env:
          KEY_SESSION_CERTIFICATE_BASE64: ${{ secrets.KEY_SESSION_CERTIFICATE_BASE64 }}
          KEY_SESSION_CERTIFICATE_PASSWORD: ${{ secrets.KEY_SESSION_CERTIFICATE_PASSWORD }}
          KEY_SESSION_SIGNING_IDENTITY: ${{ secrets.KEY_SESSION_SIGNING_IDENTITY }}
        run: |
          test -n "$KEY_SESSION_CERTIFICATE_BASE64"
          test -n "$KEY_SESSION_CERTIFICATE_PASSWORD"
          test -n "$KEY_SESSION_SIGNING_IDENTITY"
          signing_keychain="$RUNNER_TEMP/key-session-signing.keychain-db"
          signing_password=$(openssl rand -hex 24)
          certificate_path="$RUNNER_TEMP/key-session-release.p12"
          printf '%s' "$KEY_SESSION_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$certificate_path" -P "$KEY_SESSION_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$signing_keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          echo "KEY_SESSION_SIGNING_IDENTITY=$KEY_SESSION_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Install SBOM generator
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Build self-signed universal release
        run: scripts/build-release.sh dist
      - name: Verify signed application
        env:
          KEY_SESSION_SIGNING_IDENTITY: ${{ secrets.KEY_SESSION_SIGNING_IDENTITY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Key Session.app"
          codesign -dvv "dist/Key Session.app" 2>&1 | grep -F "Authority=$KEY_SESSION_SIGNING_IDENTITY"
          codesign -d --entitlements - "dist/Key Session.app" 2>&1 | grep -F 'com.apple.security.cs.disable-library-validation'
          otool -L "dist/Key Session.app/Contents/MacOS/KeySessionApp" | grep -F '@rpath/Sparkle.framework/'
          test -n "$SPARKLE_PRIVATE_KEY"
          expected_sparkle_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "dist/Key Session.app/Contents/Info.plist")
          actual_sparkle_key=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | swift scripts/derive-sparkle-public-key.swift)
          test "$actual_sparkle_key" = "$expected_sparkle_key"
      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          version=$(tr -d '[:space:]' < VERSION)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            app/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/theronburger/key-session/releases/download/v$version/" \
              --link "https://github.com/theronburger/key-session" \
              --full-release-notes-url "https://github.com/theronburger/key-session/releases/tag/v$version" \
              -o dist/appcast.xml \
              dist
          xmllint --noout dist/appcast.xml
          grep -Fq '<!-- sparkle-signatures:' dist/appcast.xml
          grep -Fq 'sparkle:edSignature=' dist/appcast.xml
          (
            cd dist
            shasum -a 256 *.zip *.sbom.cdx.json appcast.xml > checksums.txt
          )
      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.zip
            dist/*.sbom.cdx.json
            dist/appcast.xml
            dist/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/*.zip \
              dist/*.sbom.cdx.json \
              dist/appcast.xml \
              dist/checksums.txt \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --latest \
              --verify-tag \
              --title "Key Session $(tr -d '[:space:]' < VERSION)"
          else
            gh release create "$RELEASE_TAG" \
              dist/*.zip \
              dist/*.sbom.cdx.json \
              dist/appcast.xml \
              dist/checksums.txt \
              --verify-tag \
              --generate-notes \
              --title "Key Session $(tr -d '[:space:]' < VERSION)"
          fi
      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          version=$(tr -d '[:space:]' < VERSION)
          archive="dist/key-session_${version}_macos_universal.zip"
          archive_sha=$(shasum -a 256 "$archive" | awk '{print $1}')
          deploy_key="$RUNNER_TEMP/homebrew-tap-deploy-key"
          known_hosts="$RUNNER_TEMP/github-known-hosts"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          export GIT_SSH_COMMAND="ssh -i $deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts"
          tap_directory="$RUNNER_TEMP/homebrew-tap"
          git clone git@github.com:theronburger/homebrew-tap.git "$tap_directory"
          mkdir -p "$tap_directory/Casks"
          current_version=$(sed -n 's/^  version "\([^"]*\)"/\1/p' "$tap_directory/Casks/key-session.rb" 2>/dev/null || true)
          if [ -n "$current_version" ] && ! ruby -e 'require "rubygems"; exit(Gem::Version.new(ARGV[0]) >= Gem::Version.new(ARGV[1]) ? 0 : 1)' "$version" "$current_version"; then
            echo "Refusing to replace Homebrew Cask $current_version with older release $version" >&2
            exit 1
          fi
          scripts/render-homebrew-cask.sh "$version" "$archive_sha" > "$tap_directory/Casks/key-session.rb"
          git -C "$tap_directory" config user.name "Key Session Release"
          git -C "$tap_directory" config user.email "key-session-release@users.noreply.github.com"
          git -C "$tap_directory" add Casks/key-session.rb
          if git -C "$tap_directory" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tap_directory" commit -m "Update Key Session to $version"
          git -C "$tap_directory" push origin HEAD:main
