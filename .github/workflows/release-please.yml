name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-24.04
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
      - name: Run required checks for release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          release_branch=$(printf '%s' "$RELEASE_PRS" | jq -er 'if length == 1 then .[0].headBranchName else error("expected one release PR") end')
          case "$release_branch" in
            release-please--branches--*) ;;
            *) echo "Unexpected release branch: $release_branch" >&2; exit 1 ;;
          esac
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"

  publish:
    name: Publish signed release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.release-tag }}
    secrets: inherit
