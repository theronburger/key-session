name: Bug report
description: Report a reproducible key-session problem without sharing secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include passwords, tokens, Keychain contents, connection strings, or unredacted command output. For security vulnerabilities, follow SECURITY.md instead of filing a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the output of `key-session version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and hardware
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include safe reproduction steps, expected behavior, and redacted output.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all secrets and sensitive connection details from this report.
          required: true
